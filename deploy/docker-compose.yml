services:
  ncc:
    build: ..
    restart: unless-stopped
    healthcheck:
      # distroless has no shell or curl: NCC checks itself
      test: ["CMD", "/usr/local/bin/ncc", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "8443:8443"
      - "4242:4242" # DNS query logs (only used when dns_log is configured)
    volumes:
      - ncc-data:/data
      - ./config.docker.yaml:/etc/ncc/config.yaml:ro
volumes:
  ncc-data:
